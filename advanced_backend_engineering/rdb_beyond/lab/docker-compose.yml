services:
  mysql:
    image: mysql:8.0                       # Aurora MySQL 3.x tracks 8.0 — day-job parity (systems lab runs 8.4 on purpose)
    command:
      - --innodb-buffer-pool-size=256M     # small enough that big scans show real I/O
      - --slow-query-log=ON
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --long-query-time=0.1
      - --log-output=FILE
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rdb
    ports:
      - "3307:3306"                        # 3306 belongs to ../../study-project/lab
    volumes:
      - mysql-data:/var/lib/mysql
      - ./seed:/docker-entrypoint-initdb.d:ro
      - ./mysql-log:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      retries: 60                          # first boot seeds ~2.3M rows — takes minutes

  # Postgres joins when a contrast topic needs it (uncomment then `docker-compose up -d`).
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_PASSWORD: root
  #     POSTGRES_DB: rdb
  #   ports:
  #     - "5433:5432"

volumes:
  mysql-data:
